server {
    listen 80;
    server_name _;
    client_max_body_size 60m;   # ← добавить эту строку


    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck для docker / upstream-проверок внешнего nginx
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Хэшированные ассеты Vite — кэш на год
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker DNS: bot-контейнер может перезапускаться с новым IP,
    # nginx перечитывает адрес каждые 30 секунд
    resolver 127.0.0.11 valid=30s ipv6=off;

    # REST API мини-приложения (NestJS-бот в docker-сети)
    # /api/health -> bot:3000/api/health и т.д.
    location /api/ {
        set $bot_upstream http://bot:3000;
        proxy_pass $bot_upstream;
        proxy_http_version 1.1;

        client_body_buffer_size 16m;       # буфер для тела
        proxy_request_buffering off;       # сразу стримить на бота
        proxy_read_timeout 300s;           # бот может разархивировать/писать долго
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook MAX-бота: MAX доставляет события на {WEBHOOK_DOMAIN}/bot/webhook
    location /bot/ {
        set $bot_upstream http://bot:3000;
        proxy_pass $bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: все маршруты (react-router) отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
